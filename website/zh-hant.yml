  screen_1: 簡潔易用的介面
  screen_1_text: 以紫色、橙色醒目顯示的程式是最近安裝/修改過的（自上次執行 Geek Uninstaller 以來）。
  screen_2: 乾淨解除安裝、強制移除
  screen_2_text: 一般的解除安裝程式會在你的電腦上留下大量殘留檔案，而 Geek Uninstaller 隨後會進行深度、快速掃描，並刪除所有殘留。
  screen_3: 解除安裝微軟市集應用程式
  screen_3_text: 解除安裝微軟市集應用程式。可透過「檢視」功能表或 Ctrl+Tab 在桌面應用程式與微軟市集應用程式之間切換。
  screen_4: 快速即時搜尋
  screen_4_text: 輸入即可迅速定位程式
  screen_5: 深色模式
  screen_5_text: Geek Uninstaller 也適合你，夜貓子們
  multilingual_interface: "Geek Uninstaller 介面已翻譯成多種語言："
  review_1: Geek Uninstaller 的效能令人驚嘆。它能快速解除安裝，並找出難以找到的殘留檔案。整體而言，這款應用程式是令人印象深刻的維護工具，效能與功能相得益彰。強烈推薦。
  review_2: 總而言之，Geek Uninstaller 是一款非常實用的工具。直觀的版面配置與整體的簡潔，讓經驗不足的使用者也能輕而易舉地使用。
  review_3: 如果你想確保解除安裝程式後不在系統上留下任何東西，那 Geek Uninstaller 是完美之選。
  review_4: Geek Uninstaller 便攜輕巧，功能齊全。而且空間佔用很小，還是單一檔案，非常適合放在 USB 隨身碟裡。
  review_5: 我早已厭倦了為了管理 32 位元與 64 位元應用程式而使用好幾個不同的解除安裝工具。它們不僅沒有我希望的那麼好用，而且大多塞滿了各種我並不想要的多餘功能。Geek Uninstaller 對我來說是完美的解除安裝工具。介面簡潔完美，解除安裝快速準確。真希望能早點發現它——就在一週前，我實在受不了另一款免費的 64 位元解除安裝軟體，只好妥協買了 Revo Pro 的授權……我太喜歡你的程式了，裝好之後就用它解除安裝了 Revo Pro，哈哈。
  review_6: 我以前用過其他解除安裝工具（例如 Revo Uninstaller 之類的），而你們的產品堪稱完勝。它非常容易使用，而且我從未遇到過像 Revo 那樣程式不出現在解除安裝清單中的問題。我經常安裝和解除安裝軟體，GeekUninstaller 無疑讓我的生活更輕鬆，更不用說讓我的電腦乾淨多了。再次感謝這款出色的產品。
  review_7: 我只想非常感謝你們開發了這麼棒的軟體。我最近用過 Revo Uninstaller 和 IObit Uninstaller，但它們用起來並不那麼令人滿意。Revo Uninstaller 不會列出我所有的程式，而 IObit Uninstaller 刪除得太多，導致其他程式衝突。所以，簡而言之……我一度放棄使用解除安裝工具，直到我下載了 GeekUninstaller。你們真的創造出了比競爭對手好得多的東西……我只想為此感謝你們。我已經開始向朋友和家人推薦你們的產品。你們做得很好，繼續保持。
  review_8: 這些年來我試過大量解除安裝工具。Geek Uninstaller 無疑是我見過的最好的解除安裝工具。簡單、極其有效、易用，而且能完成任務。恭喜。

