  text_1: 제 이름은 Thomas Koen입니다. 소프트웨어 개발자로서 저는 컴퓨터 화면 앞에서 많은 시간을 보냅니다. 그렇기 때문에 제가 사용하는 소프트웨어 도구에 각별히 신경을 씁니다. 저는 꽤 까다로운 편이며, 도구가 어떻게 작동해야 하는지에 대해 확고한 기준을 가지고 있습니다. 아마 여러분도 저와 비슷하실 것 같네요.
  text_2: Geek Uninstaller는 단순하면서도 매우 강력하고 빠른 유틸리티입니다 (C++로 작성되었습니다).
  pro_text: GeekUninstaller의 프로 버전은 [Uninstall Tool](https://crystalidea.com/uninstall-tool?source=geek&campaign=about)라는 명칭으로 제공되며, 제 코드를 기반으로 CrystalIDEA Software에서 개발했습니다
