  tour_feature_5_text: Tezkor işga tuşadi. Yozişingiz bilanoq Geek kerakli dasturni bir zumda topadi.
  tour_feature_6: Portativ
  tour_feature_6_text: Bitta kiçik EXE 32 va 64 razryadli Windows tizimlarida örnatmasdan işlaydi.
  screen_1: Oddiy, ammo samarali interfeys
  screen_1_text: Yaqinda örnatilgan/yangilangan dasturlar röyxatda puşti rangda ajratib körsatiladi.
  screen_2: Toza öçiriş, majburiy öçiriş
  screen_2_text: Standart öçirib taşlaş dasturi kompyuteringizda juda köp qoldiqlarni (fayl tizimi elementlari, reyestr) qoldirişi mumkin. 
  screen_3: Windows Store orqali örnatilgan dasturlarni öçiriş
  screen_3_text: Köriniş menyusi yoki Ctrl+Tab tugmalari yordamida standart hamda Microsoft Store ilovalari orasida almaşing.
  screen_4: Tezkor qidiruv
  screen_4_text: Izlanayotgan dastur nomining istalgan ma’lum qismini yozişni boşlang, röyxat darhol saralanadi.
  screen_5: Qoronği rejim
  screen_5_text: Geek Uninstaller Sizga, şuningdek, tunda işlaşni yaxşi köradiganlarga ham qulay.
  multilingual_interface: "Interfeys köplab tillarda, şu jumladan özbek tilida ham mavjud:"
  review_1: Geek Uninstaller unumdorligi ajoyib. U tezda öçirib taşlanadi va heç kim topa olmagan fayllarni topadi. Umuman olganda, ilova ham unumdorlikni, ham funksiyalarni ta’minlaydigan ta’sirçan texnik xizmat körsatiş vositasidir. Tavsiya etaman.
  review_2: Xulosa şuki, Geek Uninstaller juda foydali bölişi mumkin bölgan ajoyib vositadir. Tajribasiz foydalanuvçilar uşbu dastur bilan işlaşda qiynalmasliklari kerak, çunki uning dizayni va umumiy soddaligi juda tuşunarli.
  review_3: Geek Uninstaller dasturni öçirib taşlaganida tizimda heç narsa qoldirmasligiga işonç hosil qilişni istagan har bir kişi uçun juda mos keladi.
  review_4: Geek Uninstaller portativ bölib, deyarli barça funksiyalarni qöllab-quvvatlaydi. Flash-disklar uçun juda mos keladi, çunki bu juda kam joy egallaydigan yagona fayldadir.
  review_5: 32 va 64 bitli ilovalarimni boşqariş uçun bir neçta turli öçirgiçlardan foydalaniş jonimga tegdi. Ular nafaqat men xohlagandek yaxşi işlamadi, balki ularning aksariyati men xohlamagan har xil keraksiz xususiyatlar bilan töldirilgan edi. Geek Uninstaller men uçun mukammal öçirgiçdir. Foydalanuvçi interfeysi sodda va mukammal, öçirib taşlaşlar esa tez va aniq amalga oşiriladi. Şunçaki buni tezroq topganimda edi, çunki men nihoyat boşqa bepul 64 bitli öçirib taşlaş ilovasidan çarçadim va atigi bir hafta oldin Revo Pro litsenziyasini sotib oldim... Dasturingiz şunçalik yoqdiki, uni örnatganimdan keyin Revo Pröni olib taşlaş uçun işlatdim, zör.
  review_6: Oldin ham boşqa öçirgiçlardan foydalanganman (masalan, Revo Uninstaller va boşqalar), sizning mahsulotingiz esa ulardan ustun keladi. Undan foydalaniş juda oson va men heç qaçon Revo kabi öçirib taşlaş röyxatini töldirmaydigan dasturlar bilan muammoga duç kelmaganman. Men dasturiy ta’minotni muntazam ravişda örnataman va öçirib taşlayman va GeekUninstaller hayotimni osonlaştirdi, kompyuterimni ança tozaligini aytmasa ham böladi. Ajoyib mahsulot uçun yana bir bor rahmat.
  review_7: Men şunçaki bunday ajoyib dasturiy ta’minotni işlab çiqqaningiz uçun sizga katta rahmat aytmoqçiman. Men yaqinda Revo Uninstaller va IObit Uninstaller dasturlaridan foydalandim, lekin ulardan foydalaniş unçalik yoqimli emas edi. Revo Uninstaller barça dasturlarim röyxatini bermadi va IObit Uninstaller juda köpini olib taşladi, bu esa boşqa dasturlar örtasidagi ziddiyatni keltirib çiqardi. Xullas, qisqaça aytganda... GeekUninstaller ilovasini yuklab olmagunimça, öçirib taşlagiçlardan foydalanişni töxtatdim. Siz tom ma’noda raqobatçilardan ança yaxşiroq narsa yaratdingiz....Va men buning uçun sizga rahmat aytmoqçiman. Men allaqaçon mahsulotingizni döstlarim va oilamga tavsiya qilişni boşladim. Bu yerda yaxşi iş qildingiz, şunday davom eting.
  review_8: Yillar davomida köplab öçirgiçlarni sinab kördim. Geek Uninstaller men körgan eng yaxşi öçirgiçdir. Oddiy, juda samarali, oson va işni bajaradi. Qutluğ bölsin.

