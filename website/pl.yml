  tour_feature_4_text: Odinstalowuj aplikacje ze Sklepu Microsoft w systemach Windows 8/8.1/10/11.
  tour_feature_5: Szybki i inteligentny
  tour_feature_5_text: Błyskawiczne uruchamianie. Wyszukiwanie przez wpisywanie nazwy pozwala natychmiast zlokalizować aplikację. Szybkie skanowanie pozostałości.
  tour_feature_6: Przenośny
  tour_feature_6_text: Pojedynczy, niewielki plik EXE działa na każdym systemie Windows 32- i 64-bitowym
  screen_1: Prosty interfejs użytkownika
  screen_1_text: Programy wyróżnione kolorem fioletowym lub pomarańczowym zostały niedawno zainstalowane lub zmodyfikowane (od ostatniego uruchomienia programu Geek Uninstaller).
  screen_2: Czyste usuwanie, wymuszone usuwanie
  screen_2_text: Standardowe odinstalowywanie pozostawia na komputerze mnóstwo śmieci. Geek Uninstaller przeprowadza następnie dogłębne i szybkie skanowanie, usuwając wszystkie pozostałości.
  screen_3: Odinstalowywanie aplikacji ze Sklepu Microsoft
  screen_3_text: Odinstalowuj aplikacje ze Sklepu Microsoft. Użyj menu Widok lub skrótu Ctrl+Tab, aby przełączać się między aplikacjami desktopowymi a aplikacjami ze Sklepu.
  screen_4: Błyskawiczne wyszukiwanie
  screen_4_text: Wpisz nazwę, aby natychmiast zlokalizować program
  screen_5: Tryb ciemny
  screen_5_text: Geek Uninstaller jest też dla ciebie, nocne stworzenia
  multilingual_interface: "Interfejs programu Geek Uninstaller jest przetłumaczony na wiele języków:"
  review_1: Wydajność programu Geek Uninstaller robi wrażenie. Odinstalowuje szybko i wykrywa pliki pozostałości, których inni nie dostrzegają. Ogólnie jest to imponujące narzędzie do konserwacji systemu, które spełnia obietnice zarówno pod względem wydajności, jak i funkcji. Gorąco polecam.
  review_2: Podsumowując, Geek Uninstaller to porządne narzędzie, które potrafi być naprawdę przydatne. Mniej doświadczeni użytkownicy nie powinni mieć żadnych problemów z obsługą tego programu, dzięki intuicyjnemu układowi i ogólnej prostocie.
  review_3: Geek Uninstaller jest idealny dla każdego, kto chce mieć pewność, że po odinstalowaniu programu nie pozostawi żadnych śladów w systemie.
  review_4: Geek Uninstaller jest zarówno przenośny, jak i obsługuje niemal wszystkie funkcje, jakich można oczekiwać od narzędzia do odinstalowywania. Idealny na pendrive'y, ponieważ to pojedynczy plik zajmujący bardzo mało miejsca.
  review_5: Mam już dość używania kilku różnych deinstalatorów tylko po to, żeby zarządzać aplikacjami 32- i 64-bitowymi. Nie dość, że nie działały tak dobrze, jak bym chciał, to większość z nich była nafaszerowana różnymi zbędnymi funkcjami, których nie potrzebowałem. Geek Uninstaller to dla mnie idealny deinstalator. Interfejs jest prosty i dopracowany, a odinstalowywanie przebiega szybko i precyzyjnie. Szkoda tylko, że nie znalazłem go wcześniej — w końcu zmęczony inną darmową aplikacją do odinstalowywania 64-bitowego poddałem się i tydzień temu kupiłem licencję Revo Pro... Tak bardzo spodobał mi się ten program, że użyłem go do odinstalowania właśnie Revo Pro zaraz po jego instalacji, lol.
  review_6: Używałem wcześniej innych deinstalatorów (m.in. Revo Uninstaller i innych), a Twój produkt bije je wszystkie na głowę. Jest niezwykle łatwy w użyciu i nigdy nie miałem z nim problemów, które zdarzały mi się w Revo — że programy nie pojawiają się na liście do odinstalowania. Instaluję i odinstalowuję oprogramowanie dość regularnie, a GeekUninstaller zdecydowanie ułatwił mi życie i sprawił, że mój komputer jest znacznie czystszy. Dziękuję za znakomity produkt.
  review_7: Chcę po prostu bardzo podziękować za stworzenie tak wspaniałego oprogramowania. Używałem ostatnio Revo Uninstaller i IObit Uninstaller, ale żaden z nich nie był szczególnie przyjemny w użyciu. Revo Uninstaller nie wyświetlał wszystkich moich programów, a IObit Uninstaller usuwał za dużo, powodując konflikty z innymi aplikacjami. Krótko mówiąc — zrezygnowałem z używania deinstalatorów w ogóle, aż do momentu, gdy pobrałem GeekUninstaller. Dosłownie stworzyłeś coś znacznie lepszego od konkurencji... I chcę ci za to podziękować. Już zacząłem polecać twój produkt znajomym i rodzinie. Dobra robota, tak trzymaj.
  review_8: Przez lata próbowałem mnóstwa deinstalatorów. Geek Uninstaller jest zdecydowanie najlepszym, jaki kiedykolwiek widziałem. Prosty, niezwykle skuteczny, łatwy w obsłudze i robi swoje. Gratulacje.

