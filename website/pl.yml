  text_1: Nazywam się Thomas Koen. Jako programista spędzam dużo czasu przed ekranem komputera. Właśnie dlatego naprawdę zależy mi na narzędziach, z których korzystam. Jestem wymagający i mam wyraźne poglądy na to, jak powinny działać moje programy. Prawdopodobnie jesteś do mnie podobny.
  text_2: Geek Uninstaller to proste, ale bardzo wydajne i szybkie narzędzie (napisane w C++).
  pro_text: Wersja Pro programu GeekUninstaller nosi nazwę [Uninstall Tool](https://crystalidea.com/uninstall-tool?source=geek&campaign=about) i jest rozwijana przez firmę CrystalIDEA Software na podstawie mojego kodu.
