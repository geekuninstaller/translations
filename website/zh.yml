  screen_1: 简洁易用的界面
  screen_1_text: 以紫色、橙色高亮显示的程序是最近安装/修改过的（自上次运行 Geek Uninstaller 以来）。
  screen_2: 干净卸载、强制删除
  screen_2_text: 普通卸载程序会留下大量残留文件。Geek Uninstaller 会在卸载后进行深度、快速扫描，把残留一网打尽。
  screen_3: 卸载微软商店应用
  screen_3_text: 卸载微软商店应用。可通过“查看”菜单或 Ctrl+Tab 在桌面应用与商店应用之间切换。
  screen_4: 即输即搜
  screen_4_text: 输入即可迅速定位程序
  screen_5: 深色模式
  screen_5_text: 夜猫子们，Geek Uninstaller 也适合您。
  multilingual_interface: "Geek Uninstaller 界面已翻译成大部分语言："
  review_1: Geek Uninstaller 的表现令人印象深刻。它卸载迅速，还能揪出其他工具找不到的残留文件。总体而言，这是一款出色的维护工具，性能与功能兼备。强烈推荐。
  review_2: 总而言之，Geek Uninstaller 是一款颇为实用的工具。界面直观、操作简单，新手也能轻松上手。
  review_3: 想确保卸载软件后不在系统中留下任何痕迹？Geek Uninstaller 是不二之选。
  review_4: Geek Uninstaller 便携免安装，卸载工具该有的功能基本都有。单文件、占用空间极小，放进 U 盘再合适不过。
  review_5: 我早已厌倦了为了同时管理 32 位和 64 位程序而装好几个不同卸载器的日子。它们不仅不如我意，大多还塞满了我根本用不上的冗余功能。Geek Uninstaller 对我来说就是完美的卸载器：界面简洁完美，卸载快速准确。真希望早点发现它——就在一周前，我实在受不了之前那款免费的 64 位卸载软件，只好咬牙买了 Revo Pro 的授权……我太喜欢你的软件了，装好之后顺手就用它把 Revo Pro 卸了，哈哈。
  review_6: 我以前用过其他卸载器（比如 Revo Uninstaller 等），你们的产品完胜它们。它非常易用，我也从未遇到过 Revo 那样程序不出现在卸载列表里的问题。我经常安装和卸载软件，GeekUninstaller 让我的生活更轻松，电脑也更干净了。再次感谢这款出色的产品。
  review_7: 我只想衷心感谢你们开发了这么棒的软件。我最近用过 Revo Uninstaller 和 IObit Uninstaller，但用起来都不太舒服：Revo 列不全我的程序，IObit 又删得太多，弄得其他程序出冲突。总之……我一度彻底放弃了卸载器，直到遇见 GeekUninstaller。你们的确做出了远胜竞品的东西……对此我真心感谢。我已经开始向亲友推荐你们的产品了。干得漂亮，继续保持！
  review_8: 这些年来我试过一大堆卸载器。Geek Uninstaller 毫无疑问是我用过最好的卸载器：简单、极其高效、易用，还能真正解决问题。干得漂亮。

