  multilingual_interface: "Geek Uninstaller 界面已翻译成多种语言："
  review_1: Geek Uninstaller 的性能令人惊叹。它能快速卸载，并找出难以找到的残留文件。总体而言，这款应用是令人印象深刻的维护工具，性能与功能相得益彰。强烈推荐。
  review_2: 总而言之，Geek Uninstaller 是非常实用的工具。直观的布局与整体的简洁，让经验不足的用户也能轻而易举地使用。
  review_3: 如果您想确保卸载程序后不在系统上留下任何东西，那 Geek Uninstaller 是完美之选。
  review_4: Geek Uninstaller 便携轻巧，功能齐全。而且空间占用很小，还是单文件，非常适合放在闪存盘里。
  review_5: 我早已厌倦了为了管理 32 位和 64 位应用程序而使用好几个不同的卸载器。它们不仅没有我希望的那么好用，而且大多塞满了各种我并不想要的多余功能。Geek Uninstaller 对我来说是完美的卸载器。界面简洁完美，卸载快速准确。真希望能早点发现它——就在一周前，我实在受不了另一款免费的 64 位卸载软件，只好妥协买了 Revo Pro 的许可证……我太喜欢你的程序了，装好之后就用它卸载了 Revo Pro，哈哈。
  review_6: 我以前用过其他卸载器（比如 Revo Uninstaller 之类的），而你们的产品堪称完胜。它非常容易使用，而且我从未遇到过像 Revo 那样程序不出现在卸载列表中的问题。我经常安装和卸载软件，GeekUninstaller 无疑让我的生活更轻松，更不用说让我的电脑干净多了。再次感谢这款出色的产品。
  review_7: 我只想非常感谢你们开发了这么棒的软件。我最近用过 Revo Uninstaller 和 IObit Uninstaller，但它们用起来并不那么令人满意。Revo Uninstaller 不会列出我所有的程序，而 IObit Uninstaller 删除得太多，导致其他程序冲突。所以，简而言之……我一度放弃使用卸载器，直到我下载了 GeekUninstaller。你们真的创造出了比竞争对手好得多的东西……我只想为此感谢你们。我已经开始向朋友和家人推荐你们的产品。你们做得很好，继续保持。
  review_8: 这些年来我试过大量卸载器。Geek Uninstaller 无疑是我见过的最好的卸载器。简单、极其有效、易用，而且能完成任务。恭喜。

